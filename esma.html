<!DOCTYPE html>
<html lang="tr">
<head>

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script>
        // Tema ve Dil Kontrolü (Sayfa yüklenmeden önce çalışır, titremeyi önler)
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const savedBg = localStorage.getItem('custom_bg');
        if (savedBg && savedTheme !== 'light') {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }

        const savedLang = localStorage.getItem('user_lang') || 'tr';
        document.documentElement.lang = savedLang;
        if (savedLang === 'ar') {
            document.documentElement.dir = 'rtl';
        } else {
            document.documentElement.dir = 'ltr';
        }
    </script>

    <style>
        /* Gece Teması (Varsayılan Koyu Mode) */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Gündüz Teması (Açık Mode - Kesin Geçiş) */
        [data-theme="light"] {
            --bg-color: #f1f5f9 !important;
            --card-bg: #ffffff !important;
            --accent-color: #059669 !important;
            --text-color: #0f172a !important;
            --text-muted: #64748b !important;
            --border-color: #cbd5e1 !important;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08) !important;
        }

        html[lang="ar"] {
            --font-family: 'Amiri', 'Traditional Arabic', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .nav-controls {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            width: 42px;
            height: 42px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }

        .nav-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .page-header {
            background: linear-gradient(135deg, var(--accent-color) 0%, rgba(16, 185, 129, 0.7) 100%);
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            color: #ffffff;
            box-shadow: var(--shadow);
            transition: background 0.3s ease;
        }

        .page-header h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-family: 'Georgia', serif;
        }

        .page-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .esma-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .esma-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.3s ease;
        }

        .esma-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .esma-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .esma-number {
            width: 32px;
            height: 32px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .esma-info h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 2px;
        }

        .esma-info p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .esma-arabic-text {
            font-size: 1.6rem;
            font-family: 'Georgia', 'Amiri', serif;
            font-weight: bold;
            color: var(--accent-color);
            text-align: right;
        }

        /* MODAL STİLLERİ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-arabic-title {

            font-size: 2.5rem;
            color: var(--accent-color);
            text-align: center;
            margin: 4px 0;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-color);
        }

        .modal-body div strong {
            color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .action-btn:hover {
            border-color: var(--accent-color);
        }

        .action-btn.primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .footer {
            margin: 20px 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .footer span {
            color: var(--accent-color);
            font-weight: 600;
        }

        html[dir="rtl"] .esma-arabic-text {
            text-align: left;
        }
        html[dir="rtl"] .nav-btn#back-btn {
            transform: scaleX(-1);
        }
    </style>
</head>

    let currentSelectedEsma = null;

    function renderEsmaList() {
        const listContainer = document.getElementById('esma-list');
        listContainer.innerHTML = '';

        esmaData.forEach(esma => {
            const card = document.createElement('div');
            card.className = 'esma-card';
            card.onclick = () => openModal(esma);

            card.innerHTML = `
                <div class="esma-left">
                    <div class="esma-number">${esma.id}</div>
                    <div class="esma-info">
                        <h3>${esma.name}</h3>
                        <p>${esma.meaning}</p>
                    </div>
                </div>
                <div class="esma-arabic-text">${esma.arabic}</div>
            `;
            listContainer.appendChild(card);
        });
    }

    function openModal(esma) {
        stopAudio();
        currentSelectedEsma = esma;
        document.getElementById('modalNumber').textContent = `${esma.id}`;
        document.getElementById('modalArabic').textContent = esma.arabic;
        document.getElementById('modalName').textContent = esma.name;
        document.getElementById('modalMeaning').textContent = esma.meaning;

        document.getElementById('esmaModal').classList.add('active');
    }

    function closeModal() {
        stopAudio();
        document.getElementById('esmaModal').classList.remove('active');
    }

    function closeModalOnOutside(event) {
        if (event.target.id === 'esmaModal') {
            closeModal();
        }
    }

    function stopAudio() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }

    function playHumanAudioPronunciation() {
        if (!currentSelectedEsma) return;
        stopAudio();
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(currentSelectedEsma.name);
            utterance.lang = 'tr-TR';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Tarayıcınız sesli okuma özelliğini desteklemiyor.");
        }
    }

    // --- TEMA YÖNETİMİ ---
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleTheme() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const newTheme = isLight ? 'dark' : 'light';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        const btn = document.getElementById('theme-toggle');
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            if (btn) btn.innerHTML = '☀️';
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
            if (btn) btn.innerHTML = '🌙';
            localStorage.setItem('theme', 'dark');
        }
    }

    };

    const currentLang = localStorage.getItem('user_lang') || 'tr';

    function applyGlobalLanguage(lang) {
        const t = uiTranslations[lang] || uiTranslations.tr;
        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.title = t.docTitle;

        document.getElementById('page-title').textContent = t.pageTitle;
        document.getElementById('page-desc').textContent = t.pageDesc;
        document.getElementById('listen-text').textContent = t.listenText;
        document.getElementById('close-text').textContent = t.closeText;
        
        const footer = document.getElementById('footer-text');
        if (footer) {
            footer.innerHTML = t.footerText + `<span id="footer-span">${t.footerSpan}</span>`;
        }
    }

    window.onload = () => {
        initTheme();
        applyGlobalLanguage(currentLang);
        renderEsmaList();
    };
